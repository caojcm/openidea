name: Windows Portable
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit produced by upstream sync"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-portable
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    if: github.repository == 'caojcm/openidea'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with: { key: windows-portable-x64 }
      - run: pnpm install --frozen-lockfile
      - name: Build without an installer or upstream updater
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --config src-tauri/tauri.portable.conf.json -- --locked
      - name: Package executable and runtime files
        run: ./scripts/package-windows-portable.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/openidea.exe -OutputDirectory portable
      - name: Smoke test the extracted portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'openidea-portable-smoke'
          Expand-Archive -LiteralPath portable/OpenIDEA-windows-x64-portable.zip -DestinationPath $destination
          $folder = Join-Path $destination 'OpenIDEA-windows-x64-portable'
          $app = Start-Process -FilePath (Join-Path $folder 'openidea.exe') -WorkingDirectory $folder -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($app.HasExited) {
              throw "The packaged application exited early with code $($app.ExitCode)."
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenIDEA-windows-x64-portable
          path: |
            portable/*.zip
            portable/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows portable prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const cp = require("node:child_process");
            const { owner, repo } = context.repo;
            const tag = "windows-portable";
            const sha = cp.execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            const { version } = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const body = [
              `Windows x64 portable build of OpenIDEA ${version}.`,
              "",
              `Source: https://github.com/${owner}/${repo}/commit/${sha}`,
              "",
              "Extract the entire ZIP and run `openidea.exe`. Requires the system Microsoft Edge WebView2 Runtime.",
              "Settings remain in per-user AppData. Installer-based updates are disabled; download a new ZIP to update.",
              "This community build is unsigned. A SHA-256 checksum is provided.",
              "",
              "Upstream: https://github.com/l0ng-ai/openidea",
            ].join("\n");
            const { data: refs } = await github.rest.git.listMatchingRefs({ owner, repo, ref: `tags/${tag}` });
            if (refs.some((r) => r.ref === `refs/tags/${tag}`)) {
              await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha, force: true });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            let release = releases.find((r) => r.tag_name === tag);
            if (!release) {
              const { data } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha,
                name: "OpenIDEA Windows Portable", body, draft: true, prerelease: true,
              });
              release = data;
            }
            const release_id = release.id;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id });
            for (const name of ["OpenIDEA-windows-x64-portable.zip", "OpenIDEA-windows-x64-portable.zip.sha256"]) {
              const existing = assets.find((a) => a.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              const data = fs.readFileSync(path.join("portable", name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name, data,
                headers: { "content-type": "application/octet-stream" },
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id, name: "OpenIDEA Windows Portable", body,
              draft: false, prerelease: true, make_latest: "false",
            });
            core.summary.addLink("Download Windows Portable", release.html_url);
            await core.summary.write();
